# Docker image — built from the tag, always.
#
# Reacts to any v* tag, whichever way it got there: the Release workflow, or
# someone running ./release.sh locally and pushing. That is the point. The
# image stopped tracking npm because building it depended on a human running
# release.sh without SKIP_DOCKER=1 — so 0.5.0 is the newest versioned tag on
# Docker Hub while npm is several releases ahead, and 0.5.1 has no image at all.
#
# :app is the floating tag deployments follow. :<version> is immutable — it is
# never overwritten, so a version number means one thing forever.
name: Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to build (e.g. v0.5.2)'
        required: true
      platforms:
        description: 'Target platforms'
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
        default: linux/amd64

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: jgwill/medicine-wheel

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Resolve version
        id: v
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # The tag and the manifest must agree, or :<version> would label the
          # image with a version whose source is something else entirely.
          if [ "${{ github.event_name }}" = "push" ] && [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: contains(inputs.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          tags: |
            ${{ env.IMAGE }}:app
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ""
            echo "- \`${{ env.IMAGE }}:${{ steps.v.outputs.version }}\` — immutable"
            echo "- \`${{ env.IMAGE }}:app\` — floating, deployments follow this"
            echo "- platforms: \`${{ inputs.platforms || 'linux/amd64' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
