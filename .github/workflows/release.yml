# Release — one run, one human click, npm and the image together.
#
# Rebuilt after three independent research passes found two defects in the
# previous two-workflow design:
#
#   1. A tag pushed with GITHUB_TOKEN does NOT start another workflow run.
#      GitHub excludes GITHUB_TOKEN-triggered events from starting workflows
#      (except workflow_dispatch / repository_dispatch). So the tag-triggered
#      image build could never fire — the workflow written to stop the image
#      drifting from npm reproduced that drift by construction.
#
#   2. `tsc --noEmit` ran before anything was built. Every workspace package
#      points `types` into a gitignored `dist/`, so on a fresh checkout those
#      declarations do not exist. The gate either failed every run or checked
#      nothing.
#
# The correction to both: an artifact that must stay in lockstep is produced by
# the run that produced its counterpart. There is no second trigger to miss.
#
# Cutting a release:
#   1. in a branch:  npm run version:patch   (or minor / major)
#   2. commit the bump — the PR diff shows all 25 packages moving together
#   3. merge to main → this runs, pauses for one approval, then publishes
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate only — build and pack, publish nothing'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    # The one human gate, at the only irreversible moment. All three research
    # passes converged on this independently: 23 npm versions can never be
    # reused, so a person approves once and everything else is automated.
    #
    # Requires a `release` environment with a required reviewer. Until that
    # exists the job runs unattended — configure it before the first release.
    environment: release

    permissions:
      contents: write        # push the tag release.sh creates
      id-token: write        # npm provenance

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install from the committed lockfile
        run: npm ci --legacy-peer-deps

      # FIRST. Every package's `types` points into a gitignored dist/, so
      # nothing can typecheck until this has run. This was defect 2.
      - name: Build workspace packages
        run: npm run build:packages && npm run build:cli

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Test
        run: npx vitest run

      # Catches an empty or wrong `files` glob before it becomes a permanent
      # version. Cheap, and the failure it prevents is unfixable after the fact.
      - name: Pack check
        run: npm publish --dry-run --access public --ignore-scripts

      # Built before anything is published, so a broken Dockerfile fails while
      # everything is still reversible. Pushed after, so the image never
      # advertises a version npm does not have.
      - name: Build image
        run: docker build -t jgwill/medicine-wheel:app -t "jgwill/medicine-wheel:$(node -p "require('./package.json').version")" .

      - name: Configure git identity
        run: |
          git config user.name  "medicine-wheel release"
          git config user.email "release@jgwill.com"

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SKIP_BUMP: '1'          # the version was decided in the PR
          SKIP_DOCKER: '1'        # the image is this workflow's own concern
          NPM_CONFIG_PROVENANCE: 'true'
        run: ./release.sh

      - uses: docker/login-action@v3
        if: ${{ !inputs.dry_run }}
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'jgwill' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          docker push "jgwill/medicine-wheel:$VERSION"
          docker push jgwill/medicine-wheel:app

      - name: Push tag
        if: ${{ !inputs.dry_run }}
        run: git push --tags origin

      - name: Summary
        if: always()
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          {
            echo "### Release ${{ inputs.dry_run && '(dry run)' || '' }} — v$VERSION"
            echo ""
            echo "| artifact | tag |"
            echo "|---|---|"
            echo "| npm | \`@medicine-wheel/*@$VERSION\` — lockstep |"
            echo "| npm | \`@medicine-wheel/mcp\` — own major line |"
            echo "| image | \`jgwill/medicine-wheel:$VERSION\` and \`:app\` |"
            echo "| git | \`v$VERSION\` |"
          } >> "$GITHUB_STEP_SUMMARY"
