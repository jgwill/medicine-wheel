# Release — publish what the merge declared.
#
# The version is decided in a branch and reviewed in the PR diff, where it is
# visible across all 23 workspace package.json files. Merging to main is the
# moment it becomes real: CI publishes the version already declared, and
# decides nothing itself.
#
# That ordering is what removes the loop. An earlier design had CI bump the
# version on main, which pushes a commit to main, which re-triggers CI. Here
# CI never commits to main — it publishes and tags. Tag pushes do not match a
# branch filter, so the tag it creates cannot re-trigger this workflow; it
# triggers docker-image.yml, which is the intent.
#
# Cutting a release:
#   1. in a branch:  npm run version:patch     (or version:minor / version:major)
#   2. commit the bump — the PR diff shows every package moving together
#   3. merge to main  → this workflow publishes, tags, and the image follows
#
# workflow_dispatch remains for release candidates from a branch, where the
# version is set by hand and nothing is merged.
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'package.json'          # the declared version — the only trigger that matters
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate only — no publish, no tag'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    # A push to main touching package.json is not always a release — a
    # dependency change touches it too. Publishing is gated on the declared
    # version being absent from npm, which is the only honest signal.
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@medicine-wheel/app@$VERSION" version >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "@medicine-wheel/app@$VERSION is already on npm — nothing to release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "@medicine-wheel/app@$VERSION is not on npm — releasing." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    needs: guard
    if: ${{ needs.guard.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to push the tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci --legacy-peer-deps

      # The gate. 23 packages go out at once and an npm version cannot be
      # reused, so a broken publish is not something you undo.
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Test
        run: npx vitest run

      - name: Configure git identity
        run: |
          git config user.name  "medicine-wheel release"
          git config user.email "release@jgwill.com"

      - name: Publish the declared version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SKIP_BUMP: '1'            # the version was decided in the PR
          SKIP_DOCKER: '1'          # docker-image.yml owns the image, on tag
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: ./release.sh

      - name: Push tag
        if: ${{ !inputs.dry_run }}
        run: git push --tags origin

      - name: Summary
        if: always()
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          {
            echo "### Released ${{ inputs.dry_run && '(dry run)' || '' }}"
            echo ""
            echo "- \`@medicine-wheel/*@$VERSION\` — 23 packages, lockstep"
            echo "- tag \`v$VERSION\` pushed; docker-image.yml builds the image next"
          } >> "$GITHUB_STEP_SUMMARY"
